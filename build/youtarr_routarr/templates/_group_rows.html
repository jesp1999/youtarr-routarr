<tbody id="group-rows">
  {% for item, episode, title, special in bulk.rows %}
  <tr>
    <td class="episode"><input type="hidden" name="include-{{ item.video_id }}" value="on"><span class="code">S{{ "%02d"|format(0 if special else bulk.season) }}E</span><input class="input num" type="number" min="1" name="episode-{{ item.video_id }}" value="{{ episode }}" aria-label="Episode number"></td>
    <td><input class="input" name="title-{{ item.video_id }}" value="{{ title }}" aria-label="Episode title" title="Uploaded {{ item.upload_date or 'on an unknown date' }}"></td>
    <td><input type="checkbox" name="special-{{ item.video_id }}"{% if special %} checked{% endif %}
      aria-label="Special: file into Season 0"
      hx-get="{{ url_for('group_rows', key=bulk.key) }}" hx-trigger="change" hx-include="#panel-form" hx-target="#group-rows" hx-swap="outerHTML"></td>
  </tr>
  {% endfor %}
</tbody>
