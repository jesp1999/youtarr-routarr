<span id="episode-{{ item.video_id }}" class="contents">
  <label>Episode <input name="episode" type="number" min="1" value="{{ next_episode }}" required></label>
  {% if new_show %}
  <label>Show year <span class="tag">new show</span>
    <input name="show_year" type="number" min="1800" max="2999" value="{{ show_year or '' }}" required></label>
  {% endif %}
</span>
