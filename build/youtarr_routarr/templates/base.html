<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}YoutarrRoutarr{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='htmx.min.js') }}" defer></script>
  <script src="{{ url_for('static', filename='combobox.js') }}" defer></script>
</head>
<body>
  <header>
    <strong>YoutarrRoutarr</strong>
    <nav><a href="{{ url_for('queue') }}">Queue</a> <a href="{{ url_for('filed') }}">Filed</a></nav>
  </header>
  {% if dry_run %}<p class="banner">Dry-run mode: previews work, but nothing is written to disk.</p>{% endif %}
  <main>{% block content %}{% endblock %}</main>
  <footer>YoutarrRoutarr is free software under the AGPL-3.0-or-later. <a href="{{ source_url }}">Source</a></footer>
</body>
</html>
